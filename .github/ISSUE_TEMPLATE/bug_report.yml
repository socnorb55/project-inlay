name: Bug report
description: Report a problem with the macro pad, PCB, firmware, or documentation.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please provide enough detail to reproduce or investigate it.

  - type: input
    id: summary
    attributes:
      label: What went wrong?
      description: Give a short, specific summary of the problem.
      placeholder: The macro pad does not register key presses after flashing...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - PCB or hardware
        - Rust firmware
        - Build or flashing process
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: revision
    attributes:
      label: Hardware or firmware details
      description: Include the PCB revision, firmware version or commit, and relevant configuration.
      placeholder: PCB rev A; firmware commit abc123; Windows 11
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that demonstrates the problem.
      placeholder: |
        1. Build the firmware with...
        2. Flash it to...
        3. Press...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include logs, error messages, photos, or videos where useful.
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I have filled out all relevant sections of this template.
          required: true
