name: Documentation update
description: Report unclear, missing, or incorrect project documentation.
title: "[Docs]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make project-inlay easier to understand and replicate.

  - type: input
    id: location
    attributes:
      label: Documentation location
      description: Link to the page or name the file and section that needs attention.
      placeholder: README.md, CONTRIBUTING.md, or a future build guide
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Type of update
      options:
        - Incorrect information
        - Missing information
        - Unclear instructions
        - Typo or formatting
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What needs to change?
      description: Explain what is inaccurate, missing, or difficult to follow.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Describe the wording, steps, or example that would make the documentation clearer.
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I have filled out all relevant sections of this template.
          required: true
